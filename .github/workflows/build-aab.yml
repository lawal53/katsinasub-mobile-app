name: Build Android APK (testing)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Write google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services-temp.json

      - name: Scaffold android/ios and apply required edits
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x scripts/patch-android.sh
          ./scripts/patch-android.sh

      - name: Write upload keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK (.apk) for testing
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Show APK signing certificate (informational)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk || true
          else
            echo "apksigner not found, skipping certificate print"
          fi

      - name: Upload .apk as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug symbols (keep these to read crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-symbols
          path: build/symbols
          if-no-files-found: warn
