name: Build Android App Bundle

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Write google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services-temp.json

      - name: Scaffold android/ios and apply required edits
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x scripts/patch-android.sh
          ./scripts/patch-android.sh

      - name: Write upload keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release App Bundle (.aab)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Verify .aab is signed with the upload key
        run: |
          SHA=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep "SHA1:")
          echo "$SHA"
          echo "$SHA" | grep -q "E6:21:EF:CD:A6:E8:E8:E0:CE:CC:AC:23:0C:74:87:7F:AB:89:71:53" || { echo "ERROR: .aab is NOT signed with the upload key"; exit 1; }

      - name: Upload .aab as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload debug symbols (keep these to read crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-symbols
          path: build/symbols
          if-no-files-found: warn
